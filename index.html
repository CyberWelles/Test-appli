<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Calcul Sous-Réseau</title>
  <meta name="description" content="Calculateur de sous-réseaux IPv4 : adresse réseau, broadcast, plage d'hôtes.">
  <meta name="theme-color" content="#1565c0">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Calcul Sous-Réseau IPv4</h1>
    <nav class="tabs" role="tablist" aria-label="Outils">
      <button type="button" role="tab" id="tab-calc" aria-controls="panel-calc" aria-selected="true">Calcul</button>
      <button type="button" role="tab" id="tab-plan" aria-controls="panel-plan" aria-selected="false" tabindex="-1">Plan d'adressage</button>
    </nav>
  </header>

  <main>
   <section id="panel-calc" role="tabpanel" aria-labelledby="tab-calc">
    <form id="form" autocomplete="off" novalidate>
      <label for="ip">Adresse IP</label>
      <input id="ip" name="ip" type="text" inputmode="decimal"
             placeholder="192.168.1.10" spellcheck="false" autocapitalize="off">

      <label for="mask">Masque (CIDR ou décimal)</label>
      <input id="mask" name="mask" type="text" inputmode="decimal"
             placeholder="24  ou  255.255.255.0" spellcheck="false" autocapitalize="off">

      <div class="presets" aria-label="Masques courants">
        <button type="button" data-cidr="8">/8</button>
        <button type="button" data-cidr="16">/16</button>
        <button type="button" data-cidr="24">/24</button>
        <button type="button" data-cidr="25">/25</button>
        <button type="button" data-cidr="26">/26</button>
        <button type="button" data-cidr="27">/27</button>
        <button type="button" data-cidr="28">/28</button>
        <button type="button" data-cidr="30">/30</button>
      </div>

      <p id="error" class="error" role="alert" hidden></p>
    </form>

    <section id="results" class="results" aria-live="polite" hidden>
      <div class="row"><span>Masque</span><output id="r-mask"></output></div>
      <div class="row"><span>Wildcard</span><output id="r-wildcard"></output></div>
      <div class="row hl"><span>Adresse réseau</span><output id="r-network"></output></div>
      <div class="row hl"><span>Broadcast</span><output id="r-broadcast"></output></div>
      <div class="row"><span>1ʳᵉ adresse utilisable</span><output id="r-first"></output></div>
      <div class="row"><span>Dernière adresse utilisable</span><output id="r-last"></output></div>
      <div class="row hl"><span>Nombre d'hôtes</span><output id="r-hosts"></output></div>
      <p id="note" class="note" hidden></p>
    </section>
   </section>

   <section id="panel-plan" role="tabpanel" aria-labelledby="tab-plan" hidden>
    <form id="plan-form" autocomplete="off" novalidate>
      <label for="block">Bloc réseau (CIDR)</label>
      <input id="block" type="text" inputmode="decimal"
             placeholder="192.168.10.0/24" spellcheck="false" autocapitalize="off">

      <div class="vlan-head" aria-hidden="true">
        <span>Nom du VLAN</span><span>Hôtes</span><span></span>
      </div>
      <div id="vlans"></div>
      <button type="button" id="add-vlan" class="btn-secondary">+ Ajouter un VLAN</button>

      <label class="check">
        <input type="checkbox" id="gw-extra" checked>
        La passerelle s'ajoute au nombre d'hôtes
      </label>

      <p id="plan-error" class="error" role="alert" hidden></p>
    </form>

    <div id="plan-results" aria-live="polite" hidden>
      <p id="plan-warning" class="warning" role="alert" hidden></p>
      <div id="plan-summary" class="summary"></div>
      <div id="plan-list"></div>
    </div>
   </section>
  </main>

  <template id="vlan-row">
    <div class="vlan-row">
      <input class="vlan-name" type="text" placeholder="Nom" aria-label="Nom du VLAN" spellcheck="false">
      <input class="vlan-hosts" type="text" inputmode="numeric" placeholder="0" aria-label="Nombre d'hôtes">
      <button type="button" class="vlan-del" aria-label="Supprimer ce VLAN">×</button>
    </div>
  </template>

  <script src="app.js"></script>
  <script src="vlsm.js"></script>
</body>
</html>
